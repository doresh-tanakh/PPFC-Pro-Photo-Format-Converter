name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: ppfc-macos-pkg
            pattern: release/*.pkg
          - os: windows-latest
            script: dist:win
            artifact: ppfc-windows-installer
            pattern: release/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify renderer completion results
        run: node qa/renderer.cjs
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Build installer
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify macOS signature and launch
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="release/mac-arm64/PPFC.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          "$app/Contents/MacOS/PPFC" > "$RUNNER_TEMP/ppfc-launch.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          sleep 10
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/ppfc-launch.log"
            echo "Packaged PPFC exited during startup"
            exit 1
          fi
      - name: Verify packaged AVIF conversion and completion UI
        run: node qa/packaged-smoke.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Publish installers to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.pkg release/*.exe --clobber --repo "$GH_REPO"
          else
            gh release create "$RELEASE_TAG" release/*.pkg release/*.exe \
              --verify-tag \
              --title "PPFC $RELEASE_TAG" \
              --notes "macOS and Windows installers for Pro Photo Format Converter." \
              --repo "$GH_REPO"
          fi
